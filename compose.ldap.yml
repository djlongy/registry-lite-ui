# LDAP login: dex with its LDAP connector as the OIDC provider for compose.oidc.yml.
# Use with both: -f compose.yml -f compose.oidc.yml -f compose.ldap.yml
# dex serves HTTPS with TLS_CERT and a readable copy of the key (DEX_TLS_KEY); LDAP passwords go through it.
# Set OIDC_ISSUER_URL to the public URL of dex, for example https://dex.example.internal:5556/dex (the port dex listens on; it must match `issuer` in auth/dex-ldap.yaml), and DEX_HOST to its host name.
# oauth2-proxy trusts TLS_CERT (a CA, or the self-signed certificate itself) and reaches dex by that name inside the compose network.
# Never set OAUTH2_PROXY_SSL_INSECURE_SKIP_VERIFY: it removes the protection the HTTPS listener adds.
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}

services:
  dex:
    image: dexidp/dex:v2.46.0@sha256:933fcd3f523338c847b88ef84a7145fb2fcb7b9917f08418612afeaaa2001777
    command: dex serve /etc/dex/config.yaml
    ports: ["5556:5556"]
    networks:
      default:
        aliases: ["${DEX_HOST:?set DEX_HOST, the host name in OIDC_ISSUER_URL}"]
    environment:
      LDAP_BIND_PW: ${LDAP_BIND_PW:?set LDAP_BIND_PW, the password of the dex bind account}
    volumes:
      - ./auth/dex-ldap.yaml:/etc/dex/config.yaml:ro
      - ${TLS_CERT:?set TLS_CERT, dex serves HTTPS because LDAP passwords pass through it}:/certs/tls.crt:ro
      - ${DEX_TLS_KEY:?set DEX_TLS_KEY, a copy of the key readable by the dex user}:/certs/tls.key:ro
    logging: *logging
    mem_limit: 128m
    pids_limit: 64
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  ui-auth:
    environment:
      OAUTH2_PROXY_PROVIDER_CA_FILES: /certs/dex-ca.crt
    volumes:
      - ${TLS_CERT}:/certs/dex-ca.crt:ro
