# OIDC in front of the UI with oauth2-proxy. Set the OAUTH2_PROXY_* values in .env, see README.
services:
  registry-lite-ui:
    ports: !reset []
    environment:
      UI_ALLOWED_HOSTS: "${UI_ALLOWED_HOSTS:?set UI_ALLOWED_HOSTS to the host name users type in the browser}"
      UI_LOGIN_URL: /oauth2/start?rd=%2F
      UI_LOGOUT_URL: /oauth2/sign_out?rd=%2F
  ui-auth:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
    ports: ["${UI_PORT:-8080}:4180"]
    environment:
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_UPSTREAMS: http://registry-lite-ui:8080
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:?set OIDC_ISSUER_URL}
      OAUTH2_PROXY_CLIENT_ID: ${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OIDC_COOKIE_SECRET:?set OIDC_COOKIE_SECRET}
      OAUTH2_PROXY_REDIRECT_URL: ${OIDC_REDIRECT_URL:?set OIDC_REDIRECT_URL}
      OAUTH2_PROXY_EMAIL_DOMAINS: "${OIDC_EMAIL_DOMAINS:?set OIDC_EMAIL_DOMAINS, for example example.internal ('*' admits every account the issuer vouches for)}"
      OAUTH2_PROXY_ALLOWED_GROUPS: "${OIDC_ALLOWED_GROUPS:-}"
      OAUTH2_PROXY_COOKIE_SECURE: "${OIDC_COOKIE_SECURE:-true}"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_PASS_HOST_HEADER: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      # Anyone may browse. POST (copy, move, delete) still needs a session.
      OAUTH2_PROXY_SKIP_AUTH_ROUTES: GET=^/
    mem_limit: 128m
    pids_limit: 64
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [registry-lite-ui]
    restart: unless-stopped
