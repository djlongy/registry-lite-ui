# The PyPI source: one GitLab PyPI index beside the registry, with a type filter in the tree. Set in .env:
#   PYPI_INDEX_URL       the index pip is given, a group's or a project's:
#                          https://gitlab.example.internal/api/v4/groups/<id or path>/-/packages/pypi/simple
#                          https://gitlab.example.internal/api/v4/projects/<id or path>/packages/pypi/simple
#   UI_PYPI_PUBLIC_URL   the GitLab address pip users type, when it differs from the one in PYPI_INDEX_URL
#   UI_PYPI_INDEX_AUTH   auto (default) leaves __token__:<TOKEN> out of install commands while GitLab serves the index anonymously
#   UI_PYPI_PUBLIC       true lets anyone see the packages behind compose.oidc.yml; unset, they need a login there
# The token goes in ./secrets/gitlab_token: one line, readable by uid 65534 (see README). A personal, group or project
# access token with read_api: GitLab refuses a deploy token on the packages API. For a public index the file may be empty,
# and the UI then reads GitLab anonymously.
# The file is a bind mount, not a compose secret: podman-compose mounts secrets without an SELinux label, so a token
# file under a home directory gave "Permission denied: '/run/secrets/gitlab_token'". `z` relabels it.
# These overrides add to the service named registry-lite-ui. Keep that name and set container_name to rename the container.
services:
  registry-lite-ui:
    environment:
      PYPI_INDEX_URL: ${PYPI_INDEX_URL:?set PYPI_INDEX_URL to the GitLab PyPI index of a group or a project}
      GITLAB_TOKEN_FILE: /run/secrets/gitlab_token
      GITLAB_CA_FILE: "${GITLAB_CA_FILE:-}"
      UI_PYPI_PUBLIC_URL: "${UI_PYPI_PUBLIC_URL:-}"
      UI_PYPI_INDEX_AUTH: "${UI_PYPI_INDEX_AUTH:-auto}"
      UI_PYPI_PUBLIC: "${UI_PYPI_PUBLIC:-false}"
      UI_PYPI_POLL_INTERVAL: "${UI_PYPI_POLL_INTERVAL:-60}"
    volumes:
      - ./secrets/gitlab_token:/run/secrets/gitlab_token:ro,z
