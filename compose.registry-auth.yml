# The UI authenticates to a registry that has its own basic auth. Put the password in ./secrets/registry_password.
services:
  registry-lite-ui:
    environment:
      REGISTRY_USER: ${REGISTRY_USER:?set REGISTRY_USER}
      REGISTRY_PASSWORD_FILE: /run/secrets/registry_password
    # A bind mount, not a compose secret: podman-compose mounts secrets without an SELinux label. `z` relabels it.
    volumes:
      - ./secrets/registry_password:/run/secrets/registry_password:ro,z
