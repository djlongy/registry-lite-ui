# Use after compose.tls.yml and compose.basic.yml. nginx serves HTTPS with the same certificate, the UI behind it is plain HTTP.
services:
  ui:
    environment:
      UI_TLS_CERT: ""
      UI_TLS_KEY: ""
  ui-auth:
    volumes:
      - ./auth/nginx-basic-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT}:/certs/tls.crt:ro
      - ${PROXY_TLS_KEY:?set PROXY_TLS_KEY, a copy of the key readable by the proxy group}:/certs/tls.key:ro
