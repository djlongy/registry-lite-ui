# Test only: a local dex as the IdP for compose.oidc.yml.
services:
  dex:
    image: dexidp/dex:v2.46.0@sha256:933fcd3f523338c847b88ef84a7145fb2fcb7b9917f08418612afeaaa2001777
    command: dex serve /etc/dex/config.yaml
    ports: ["5556:5556"]
    volumes: [./tests/oidc/dex.yaml:/etc/dex/config.yaml:ro]
  ui-auth:
    environment:
      OAUTH2_PROXY_APPROVAL_PROMPT: auto
