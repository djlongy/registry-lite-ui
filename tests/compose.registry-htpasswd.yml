# Test only: puts basic auth on the registry itself, to prove the UI can authenticate to it.
services:
  registry:
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: registry
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
    volumes:
      - ./tests/registry-htpasswd:/auth/htpasswd:ro
