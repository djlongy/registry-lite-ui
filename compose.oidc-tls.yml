# Use after compose.tls.yml and compose.oidc.yml. oauth2-proxy serves HTTPS with the same certificate, the UI behind it is plain HTTP.
services:
  registry-lite-ui:
    environment:
      UI_TLS_CERT: ""
      UI_TLS_KEY: ""
  ui-auth:
    environment:
      OAUTH2_PROXY_HTTP_ADDRESS: ""
      OAUTH2_PROXY_HTTPS_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_TLS_CERT_FILE: /certs/tls.crt
      OAUTH2_PROXY_TLS_KEY_FILE: /certs/tls.key
    volumes:
      - ${TLS_CERT}:/certs/tls.crt:ro
      - ${PROXY_TLS_KEY:?set PROXY_TLS_KEY, a copy of the key readable by the proxy group}:/certs/tls.key:ro
