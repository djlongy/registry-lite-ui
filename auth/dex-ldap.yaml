issuer: https://dex.example.internal:5556/dex
storage: {type: memory}
web: {https: 0.0.0.0:5556, tlsCert: /certs/tls.crt, tlsKey: /certs/tls.key}
expandEnv: true
staticClients:
  - id: registry-ui
    name: registry-ui
    secret: change-me-and-match-OIDC_CLIENT_SECRET
    redirectURIs: [https://registry-ui.example.internal/oauth2/callback]
connectors:
  - type: ldap
    id: ldap
    name: LDAP
    config:
      host: ldap.example.internal:636
      bindDN: cn=svc-dex,ou=services,dc=example,dc=internal
      bindPW: $LDAP_BIND_PW  # from the environment, never in this file
      userSearch:
        baseDN: ou=people,dc=example,dc=internal
        filter: "(objectClass=person)"
        username: uid
        idAttr: uid
        emailAttr: mail
        nameAttr: cn
