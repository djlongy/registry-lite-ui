limit_req_zone $binary_remote_addr zone=ui:1m rate=10r/s;

server {
    listen 8080 ssl;
    ssl_certificate /certs/tls.crt;
    ssl_certificate_key /certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    limit_req zone=ui burst=30 nodelay;
    auth_basic "registry-lite-ui";
    auth_basic_user_file /etc/nginx/htpasswd;
    location / {
        proxy_pass http://registry-lite-ui:8080;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization "";  # the UI has no use for the login
    }
    # Server-Sent Events: no buffering, long read timeout
    location /api/events {
        proxy_pass http://registry-lite-ui:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header Authorization "";  # the UI has no use for the login
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
