# Basic auth for the UI only. Create the file with: htpasswd -B -c auth/htpasswd <user>
services:
  registry-lite-ui:
    ports: !reset []
    environment:
      UI_ALLOWED_HOSTS: "${UI_ALLOWED_HOSTS:?set UI_ALLOWED_HOSTS to the host name users type in the browser}"
  ui-auth:
    image: nginxinc/nginx-unprivileged:1.31.7-alpine@sha256:378d0c32f6562f7fd9629170797f57d2b953aa09be983b3daaf4809bb039ca00
    ports: ["${UI_PORT:-8080}:8080"]
    volumes:
      - ./auth/nginx-basic.conf:/etc/nginx/conf.d/default.conf:ro
      - ./auth/htpasswd:/etc/nginx/htpasswd:ro
    mem_limit: 64m
    pids_limit: 64
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [registry-lite-ui]
    restart: unless-stopped
